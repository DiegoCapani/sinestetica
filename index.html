<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia - Respiro New Age</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .reticolo {
            width: 65px; height: 65px; border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transition: transform 0.5s ease-out;
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 18px 50px; font-size: 1rem; font-weight: 300; letter-spacing: 4px;
            background: none; color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 4px;
            cursor: pointer; transition: all 0.6s;
        }
        #start-btn:hover { background: white; color: black; letter-spacing: 6px; }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">INIZIA IL VIAGGIO</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, chorus, lfo;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;

    function setupAudio() {
        const limiter = new Tone.Limiter(-1).toDestination();
        
        // Riverbero molto profondo con pre-delay per non soffocare la nota
        reverb = new Tone.Reverb({ decay: 12, wet: 0.45 }).connect(limiter);
        
        // Chorus per la vibrazione eterea
        chorus = new Tone.Chorus(1.2, 4, 0.5).connect(reverb).start();
        
        // Filtro passa-basso che rende il suono vellutato
        filter = new Tone.Filter(900, "lowpass").connect(chorus);
        
        // PolySynth con inviluppo "percussivo ma dolce" (tipo arpa/piano elettrico soft)
        synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: {
                attack: 0.8,   // Entrata dolce
                decay: 3,      // Svanisce lentamente se resti fermo
                sustain: 0.2,  // Volume di sottofondo molto basso
                release: 6     // Coda lunghissima
            }
        }).connect(filter);

        synth.volume.value = -6;
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }, 
                audio: false
            });
            video.srcObject = stream;
            video.play();
        } catch (err) { alert("Accesso camera negato."); }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        setupAudio();
        await initCamera();
        startScreen.style.display = 'none';
        isActive = true;
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;
        if (time - lastUpdate > 180) { // Ritmo più umano
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 64; canvas.height = 64;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const p = ctx.getImageData(32, 32, 1, 1).data;
                processColor(p[0], p[1], p[2]); 
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        
        // SCALA PENTATONICA ESTESA (Suoni cristallini)
        const scale = ["C3", "G3", "C4", "D4", "E4", "G4", "A4", "C5", "E5", "G5"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        // GESTIONE DINAMICA DEL VOLUME
        // Se il colore è spento (saturazione < 15%), il volume scende
        const volumeFactor = hsl.s > 15 ? 1 : hsl.s / 15;
        const velocity = (hsl.l / 100) * volumeFactor * 0.7;

        if (note !== lastNote && velocity > 0.1) {
            // Suona la nota con una forza proporzionale alla vividezza del colore
            // Questo crea pause naturali e dinamica
            synth.triggerAttackRelease(note, "1n", undefined, velocity);
            lastNote = note;
        }

        // Il filtro segue la "purezza" del colore
        const fCutoff = (hsl.s * 15) + 300;
        filter.frequency.rampTo(fCutoff, 1.2);

        // Feedback visivo
        const reticolo = document.getElementById('reticolo');
        reticolo.style.borderColor = `rgb(${r},${g},${b})`;
        reticolo.style.transform = `scale(${0.8 + (hsl.s/100)})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
