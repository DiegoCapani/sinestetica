<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia - Flusso Infinito</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .reticolo {
            width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 20px 60px; font-size: 1.1rem; font-weight: 300; letter-spacing: 3px;
            background: none; color: white; border: 1px solid white; border-radius: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">ASCOLTA I COLORI</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const reticolo = document.getElementById('reticolo');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb;
    let isActive = false;
    let lastFrequency = 0;
    let lastUpdate = 0;

    function setupAudio() {
        const limiter = new Tone.Limiter(0).toDestination();
        const finalGain = new Tone.Gain(2.5).connect(limiter);
        reverb = new Tone.Reverb({ decay: 10, wet: 0.6 }).connect(finalGain);
        
        // Filtro molto caldo
        filter = new Tone.Filter(800, "lowpass").connect(reverb);
        
        // Usiamo un MonoSynth per un legato perfetto (passaggio tra note senza stacchi)
        synth = new Tone.MonoSynth({
            oscillator: { type: "sine" },
            envelope: { attack: 2, release: 4 },
            filterEnvelope: { attack: 1, baseFrequency: 200, octaves: 4 }
        }).connect(filter);

        synth.volume.value = -10;
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }, 
                audio: false
            });
            video.srcObject = stream;
            video.play();
        } catch (err) { alert("Necessario HTTPS"); }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        setupAudio();
        await initCamera();
        startScreen.style.display = 'none';
        isActive = true;
        
        // Inizia a suonare una nota base subito
        synth.triggerAttack("C4");
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;

        // Analisi costante ogni 150ms per fluidità
        if (time - lastUpdate > 150) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 64; canvas.height = 64;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const p = ctx.getImageData(32, 32, 1, 1).data;
                processColor(p[0], p[1], p[2]);
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        
        // Mappatura HUE -> FREQUENZA CONTINUA (non più solo note fisse)
        // Questo garantisce che non ci siano mai pause perché non "cerchiamo" una nota specifica
        // ma scivoliamo (portamento) tra le frequenze.
        const minFreq = 130; // Do2
        const maxFreq = 523; // Do5
        const targetFreq = minFreq + (hsl.h / 360) * (maxFreq - minFreq);

        // Se la frequenza è cambiata, scivola verso la nuova in 0.5 secondi
        if (targetFreq !== lastFrequency) {
            synth.frequency.rampTo(targetFreq, 0.6);
            lastFrequency = targetFreq;
        }

        // Il filtro segue la luminosità in modo fluido
        const fCutoff = (hsl.l * 15) + 300;
        filter.frequency.rampTo(fCutoff, 0.8);

        // Feedback visivo
        reticolo.style.borderColor = `rgb(${r},${g},${b})`;
        reticolo.style.boxShadow = `0 0 40px rgba(${r},${g},${b}, 0.5)`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
