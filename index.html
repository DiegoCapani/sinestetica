<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia Live Pro - Volume Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }

        .reticolo {
            width: 65px; height: 65px; border: 4px solid white;
            border-radius: 50%; box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        #start-btn {
            padding: 22px 55px; font-size: 1.3rem; font-weight: bold;
            background: #fff; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">AVVIA ESPERIENZA</button>
        <p style="color: #aaa; margin-top: 20px;">Alza il volume del dispositivo</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    const reticolo = document.getElementById('reticolo');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, limiter, compressor;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;
    const updateInterval = 100; 

    function setupAudio() {
        // 1. Limitatore finale per evitare distorsioni
        limiter = new Tone.Limiter(0).toDestination();
        
        // 2. Guadagno finale per pompare il volume
        const mainGain = new Tone.Gain(2.5).connect(limiter); 

        // 3. Compressore: rende il suono più "denso" e udibile
        compressor = new Tone.Compressor(-24, 4).connect(mainGain);

        // 4. Riverbero per l'atmosfera
        reverb = new Tone.Reverb({ decay: 3.5, wet: 0.35 }).connect(compressor);
        
        // 5. Filtro con risonanza per dare corpo
        filter = new Tone.Filter({
            frequency: 1200,
            type: "lowpass",
            Q: 2
        }).connect(reverb);
        
        // 6. Sintetizzatore: Triangle wave ha più volume armonico della Sine
        synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" }, 
            envelope: { 
                attack: 0.2, 
                decay: 0.3,
                sustain: 0.9,
                release: 1.5 
            }
        }).connect(filter);
        
        synth.volume.value = -3; // Quasi al massimo
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 640 } }, 
                audio: false
            });
            video.srcObject = stream;
            return new Promise(resolve => video.onloadedmetadata = () => { video.play(); resolve(); });
        } catch (err) {
            alert("Errore camera: Assicurati di usare HTTPS.");
        }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        if (Tone.context.state !== 'running') await Tone.context.resume();
        
        setupAudio();
        await initCamera();
        
        startScreen.style.display = 'none';
        isActive = true;
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;

        if (time - lastUpdate > updateInterval) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 100;
                canvas.height = 100;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const p = ctx.getImageData(50, 50, 1, 1).data;
                processColor(p[0], p[1], p[2]);
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        
        // Scala Pentatonica Maggiore per un suono cristallino
        const scale = ["C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4", "G4", "A4"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        if (note !== lastNote) {
            synth.releaseAll();
            // Aumentiamo leggermente il velocity (0.9) per più impatto
            synth.triggerAttackRelease(note, "2n", undefined, 0.9);
            lastNote = note;
        }

        // Filtro dinamico basato sulla luminosità (L)
        const freq = (hsl.l * 35) + 300;
        filter.frequency.exponentialRampTo(freq, 0.15);

        // Feedback visivo
        reticolo.style.borderColor = `rgb(${r},${g},${b})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
