<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia - Museale Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .reticolo {
            width: 70px; height: 70px; border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 20px 60px; font-size: 1.1rem; font-weight: 300; letter-spacing: 3px;
            background: none; color: white; border: 1px solid white; border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">AVVIA ESPERIENZA</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, limiter;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;
    
    // Filtro di stabilità per i colori (media mobile)
    let smoothedR = 0, smoothedG = 0, smoothedB = 0;

    function setupAudio() {
        // 1. Limiter rigidissimo per eliminare scoppiettii (clipping)
        limiter = new Tone.Limiter(-3).toDestination();
        
        // 2. Gain controllato
        const finalGain = new Tone.Gain(1.5).connect(limiter);

        // 3. Riverbero ultra-lungo (New Age)
        reverb = new Tone.Reverb({ decay: 15, wet: 0.5 }).connect(finalGain);
        
        // 4. Chorus per ammorbidire le armoniche
        const chorus = new Tone.Chorus(2, 3.5, 0.5).connect(reverb).start();
        
        filter = new Tone.Filter(800, "lowpass").connect(chorus);
        
        // 5. Synth polifonico limitato (massimo 2 note per evitare accumulo di volume)
        synth = new Tone.PolySynth(Tone.Synth, {
            maxPolyphony: 2,
            oscillator: { type: "sine" },
            envelope: { attack: 1.2, decay: 2, sustain: 0.1, release: 8 }
        }).connect(filter);
        
        synth.volume.value = -12;
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", focusMode: "continuous" }, 
                audio: false
            });
            video.srcObject = stream;
            video.play();
        } catch (err) { alert("Accesso camera negato."); }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        setupAudio();
        await initCamera();
        startScreen.style.display = 'none';
        isActive = true;
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;
        if (time - lastUpdate > 200) { // Analisi ogni 200ms per stabilità
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 100; canvas.height = 100;
                ctx.drawImage(video, 0, 0, 100, 100);
                
                // Leggiamo un'area media 20x20 per ignorare la texture della tela
                const imageData = ctx.getImageData(40, 40, 20, 20).data;
                let r = 0, g = 0, b = 0;
                for (let i = 0; i < imageData.length; i += 4) {
                    r += imageData[i]; g += imageData[i+1]; b += imageData[i+2];
                }
                const count = imageData.length / 4;
                
                // Applichiamo smoothing (il colore cambia solo se il cambiamento persiste)
                smoothedR += (r/count - smoothedR) * 0.4;
                smoothedG += (g/count - smoothedG) * 0.4;
                smoothedB += (b/count - smoothedB) * 0.4;

                processColor(Math.floor(smoothedR), Math.floor(smoothedG), Math.floor(smoothedB)); 
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        // Normalizzazione dinamica per sculture e tele poco illuminate
        let max = Math.max(r, g, b);
        let min = Math.min(r, g, b);
        let delta = max - min;

        const hsl = rgbToHsl(r, g, b);
        
        // Scala Pentatonica Cristallina
        const scale = ["C3", "G3", "C4", "D4", "E4", "G4", "A4", "C5", "E5", "G5"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        // Se siamo su sculture (bianchi/grigi) o tele scure, usiamo la luminosità
        // Abbassiamo la soglia di riconoscimento: suona quasi tutto ora.
        const velocity = (hsl.l / 100) * (hsl.s > 5 ? 0.8 : 0.4);

        if (note !== lastNote && velocity > 0.08) {
            // Rilasciamo con grazia per evitare accumuli di note che creano scoppiettii
            synth.releaseAll();
            synth.triggerAttackRelease(note, "1n", undefined, velocity);
            lastNote = note;
        }

        // Il filtro segue la luminosità (apre il suono sul marmo bianco o colori chiari)
        const fCutoff = (hsl.l * 10) + 200;
        filter.frequency.rampTo(fCutoff, 1.5);

        document.getElementById('reticolo').style.borderColor = `rgb(${r},${g},${b})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
