<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia - Debug Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: white; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ui-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; pointer-events: none; }
        .reticolo { width: 60px; height: 60px; border: 2px solid white; border-radius: 50%; }
        #debug-log { position: fixed; top: 10px; left: 10px; font-size: 10px; background: rgba(0,0,0,0.7); padding: 10px; z-index: 100; pointer-events: none; max-width: 80%; }
        #start-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        button { padding: 20px; background: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="debug-log">In attesa di avvio...</div>

    <div id="start-screen">
        <button id="start-btn">AVVIA E AUTORIZZA</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const log = (msg) => { document.getElementById('debug-log').innerText += "\n" + msg; };
    const video = document.getElementById('video');
    const startBtn = document.getElementById('start-btn');
    
    let synth, masterGain;
    let isActive = false;

    async function start() {
        log("Inizializzazione audio...");
        try {
            await Tone.start();
            masterGain = new Tone.Gain(1).toDestination();
            synth = new Tone.PolySynth(Tone.Synth).connect(masterGain);
            log("Audio OK.");
        } catch(e) { log("Errore Audio: " + e); }

        log("Richiesta fotocamera...");
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            video.srcObject = stream;
            log("Fotocamera OK.");
        } catch(e) { log("Errore Camera: " + e + ". Usa HTTPS!"); }

        log("Richiesta Movimento...");
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceMotionEvent.requestPermission();
                log("Permesso sensori: " + permission);
                if (permission === 'granted') window.addEventListener('devicemotion', handleMotion);
            } catch(e) { log("Errore Sensori: " + e); }
        } else {
            window.addEventListener('devicemotion', handleMotion);
            log("Sensori standard attivati.");
        }

        document.getElementById('start-screen').style.display = 'none';
        isActive = true;
        loop();
    }

    function handleMotion(event) {
        const a = event.accelerationIncludingGravity;
        const force = Math.sqrt(a.x**2 + a.y**2 + a.z**2);
        if (force > 13) masterGain.gain.rampTo(0, 0.5);
        else masterGain.gain.rampTo(1, 1);
    }

    function loop() {
        if (!isActive) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // Analisi basilare per testare se il suono esce
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 10; canvas.height = 10;
            ctx.drawImage(video, 0, 0, 10, 10);
            const p = ctx.getImageData(5, 5, 1, 1).data;
            
            // Suona solo se vede un cambiamento di colore significativo
            const hue = p[0]; // Semplice trigger basato sul rosso per il test
            synth.triggerAttackRelease(hue + 200, "8n");
        }
        setTimeout(loop, 500);
    }

    startBtn.addEventListener('click', start);
</script>
</body>
</html>
