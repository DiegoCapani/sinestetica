<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia - Harmonia Mundi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .reticolo {
            width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%; box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 20px 60px; font-size: 1.1rem; font-weight: 300; letter-spacing: 3px;
            background: none; color: white; border: 1px solid white; border-radius: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">ENTRA NELL'ARMONIA</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, chorus;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;

    function setupAudio() {
        const limiter = new Tone.Limiter(0).toDestination();
        const finalGain = new Tone.Gain(2).connect(limiter);
        
        // Riverbero celestiale
        reverb = new Tone.Reverb({ decay: 10, wet: 0.5 }).connect(finalGain);
        
        // Chorus per sdoppiare il suono e renderlo magico
        chorus = new Tone.Chorus(1.5, 3.5, 0.5).connect(reverb).start();
        
        // Filtro passa-basso molto dolce
        filter = new Tone.Filter(1000, "lowpass").connect(chorus);
        
        // MonoSynth con "portamento": la chiave per la musica continua
        // Il portamento scivola tra le note musicali in modo automatico
        synth = new Tone.MonoSynth({
            oscillator: { type: "sine" },
            portamento: 0.8, // Tempo di scivolamento tra le note (New Age feel)
            envelope: {
                attack: 1.5,
                release: 4
            }
        }).connect(filter);

        synth.volume.value = -8;
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }, 
                audio: false
            });
            video.srcObject = stream;
            video.play();
        } catch (err) { alert("HTTPS richiesto"); }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        setupAudio();
        await initCamera();
        startScreen.style.display = 'none';
        isActive = true;
        
        // Inizia con una nota fondamentale
        synth.triggerAttack("C4");
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;
        if (time - lastUpdate > 150) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 64; canvas.height = 64;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const p = ctx.getImageData(32, 32, 1, 1).data;
                processColor(p[0], p[1], p[2]);
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        
        // SCALA PENTATONICA MAGGIORE: Impossibile fare note brutte
        const scale = ["C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        if (note !== lastNote) {
            // Non usiamo triggerRelease! Cambiamo solo la frequenza.
            // Il 'portamento' farà il resto, scivolando verso la nota musicale.
            synth.setNote(note);
            lastNote = note;
        }

        // Il filtro ammorbidisce il suono in base alla luce
        const fCutoff = (hsl.l * 12) + 300;
        filter.frequency.rampTo(fCutoff, 1);

        document.getElementById('reticolo').style.borderColor = `rgb(${r},${g},${b})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
