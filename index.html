<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia Live Pro - Museo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; } /* Canvas di servizio per l'analisi pixel */
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }

        .reticolo {
            width: 65px; height: 65px; border: 3px solid white;
            border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        #start-btn {
            padding: 20px 50px; font-size: 1.2rem; font-weight: bold;
            background: #fff; border: none; border-radius: 50px;
            cursor: pointer; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">AVVIA ESPERIENZA</button>
        <p style="color: #888; margin-top: 20px; font-size: 0.9rem;">Usa le cuffie per un effetto migliore</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    const reticolo = document.getElementById('reticolo');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, limiter;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;
    const updateInterval = 100; // Analisi ogni 100ms (10 volte al secondo) per stabilità totale

    function setupAudio() {
        // 1. Limitatore: Impedisce scoppiettii dovuti al volume troppo alto
        limiter = new Tone.Limiter(-2).toDestination();
        
        // 2. Riverbero: Crea spazialità
        reverb = new Tone.Reverb({ decay: 5, wet: 0.4 }).connect(limiter);
        
        // 3. Filtro: Rende il suono morbido
        filter = new Tone.Filter(1000, "lowpass").connect(reverb);
        
        // 4. Sintetizzatore: PolySynth gestisce meglio le transizioni
        synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.6, release: 2 } // Attacco lungo = nessun "clic"
        }).connect(filter);
        
        synth.volume.value = -15; // Volume di sicurezza
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 640 } }, 
                audio: false
            });
            video.srcObject = stream;
            return new Promise(resolve => video.onloadedmetadata = () => { video.play(); resolve(); });
        } catch (err) {
            alert("Errore fotocamera. Assicurati di essere su HTTPS.");
        }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        if (Tone.context.state !== 'running') await Tone.context.resume();
        
        setupAudio();
        await initCamera();
        
        startScreen.style.display = 'none';
        isActive = true;
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;

        // Analisi temporizzata per non sovraccaricare il processore (e il buffer audio)
        if (time - lastUpdate > updateInterval) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Usiamo un canvas minuscolo (100px) per l'analisi: molto più veloce!
                canvas.width = 100;
                canvas.height = 100;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const p = ctx.getImageData(50, 50, 1, 1).data; // Punto centrale
                processColor(p[0], p[1], p[2]);
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        
        // Scala pentatonica (Do Maggiore)
        const scale = ["C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4", "G4", "A4"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        if (note !== lastNote) {
            // Rilascia le note precedenti con una coda dolce e suona la nuova
            synth.releaseAll();
            synth.triggerAttackRelease(note, "2n", undefined, 0.2);
            lastNote = note;
        }

        // Transizione del filtro fluida (esponenziale)
        const freq = (hsl.l * 15) + 200;
        filter.frequency.exponentialRampTo(freq, 0.1);

        // Feedback visivo
        reticolo.style.borderColor = `rgb(${r},${g},${b})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
