<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia - Spettro Cromatico Totale</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .reticolo {
            width: 65px; height: 65px; border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 18px 50px; font-size: 1rem; font-weight: 300; letter-spacing: 4px;
            background: none; color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">INIZIA IL VIAGGIO</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, chorus;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;

    function setupAudio() {
        const limiter = new Tone.Limiter(-1).toDestination();
        reverb = new Tone.Reverb({ decay: 12, wet: 0.45 }).connect(limiter);
        chorus = new Tone.Chorus(1.2, 4, 0.5).connect(reverb).start();
        filter = new Tone.Filter(900, "lowpass").connect(chorus);
        
        synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.8, decay: 3, sustain: 0.2, release: 6 }
        }).connect(filter);
        synth.volume.value = -6;
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", focusMode: "continuous" }, 
                audio: false
            });
            video.srcObject = stream;
            video.play();
        } catch (err) { alert("Attiva la fotocamera via HTTPS"); }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        setupAudio();
        await initCamera();
        startScreen.style.display = 'none';
        isActive = true;
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;
        if (time - lastUpdate > 150) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Analizziamo una zona centrale 10x10 per una media colore più fedele
                canvas.width = 100; canvas.height = 100;
                ctx.drawImage(video, 0, 0, 100, 100);
                
                const imageData = ctx.getImageData(45, 45, 10, 10).data;
                let r = 0, g = 0, b = 0;

                for (let i = 0; i < imageData.length; i += 4) {
                    r += imageData[i]; g += imageData[i+1]; b += imageData[i+2];
                }
                const count = imageData.length / 4;
                processColor(Math.floor(r/count), Math.floor(g/count), Math.floor(b/count)); 
                
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        // Applichiamo un "auto-contrast" per migliorare i colori spenti
        // Questo rende i colori del museo più vibranti per il sensore
        let max = Math.max(r, g, b);
        let min = Math.min(r, g, b);
        if (max - min < 20 && max > 50 && max < 200) {
            // Se il colore è troppo grigio, forziamo un po' di saturazione
            r = r * 1.2; g = g * 1.2; b = b * 1.2;
        }

        const hsl = rgbToHsl(r, g, b);
        
        // Scala Pentatonica (La tua sonorità New Age preferita)
        const scale = ["C3", "G3", "C4", "D4", "E4", "G4", "A4", "C5", "E5", "G5"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        // Sensibilità migliorata: abbassiamo la soglia di saturazione
        // Adesso anche i colori "tenui" (s > 8) producono suono
        const volumeFactor = hsl.s > 8 ? 1 : hsl.s / 8;
        const velocity = (hsl.l / 100) * volumeFactor * 0.7;

        if (note !== lastNote && velocity > 0.05) {
            synth.triggerAttackRelease(note, "1n", undefined, velocity);
            lastNote = note;
        }

        const fCutoff = (hsl.s * 20) + 250;
        filter.frequency.rampTo(fCutoff, 1.2);

        document.getElementById('reticolo').style.borderColor = `rgb(${r},${g},${b})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
