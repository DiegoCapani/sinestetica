<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia Museale - High Volume</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .reticolo {
            width: 80px; height: 80px; border: 3px solid rgba(255,255,255,0.6);
            border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        #start-screen {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 25px 60px; font-size: 1.2rem; font-weight: bold; letter-spacing: 4px;
            background: white; color: black; border: none; border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">AVVIA SINESTESIA</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, limiter, compressor;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;
    let sR = 0, sG = 0, sB = 0;

    function setupAudio() {
        // Limiter finale per protezione
        limiter = new Tone.Limiter(-1).toDestination();
        
        // Compressore per aumentare il volume percepito (fa suonare tutto più forte)
        compressor = new Tone.Compressor({
            threshold: -20,
            ratio: 4,
            attack: 0.05,
            release: 0.1
        }).connect(limiter);

        // Riverbero
        reverb = new Tone.Reverb({ decay: 8, wet: 0.4 }).connect(compressor);
        
        // Chorus
        const chorus = new Tone.Chorus(2, 4, 0.5).connect(reverb).start();
        
        // Filtro leggermente più aperto per dare brillantezza
        filter = new Tone.Filter(1500, "lowpass").connect(chorus);
        
        // Synth con oscillatore più ricco (fatsine) per maggior volume
        synth = new Tone.PolySynth(Tone.Synth, {
            maxPolyphony: 3,
            oscillator: { type: "fatsine", count: 3, spread: 20 },
            envelope: {
                attack: 0.5,
                decay: 1,
                sustain: 0.5,
                release: 4
            }
        }).connect(filter);

        // Volume alzato
        synth.volume.value = -4;
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }, 
                audio: false
            });
            video.srcObject = stream;
            video.play();
        } catch (err) { alert("Errore camera."); }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        setupAudio();
        await initCamera();
        startScreen.style.display = 'none';
        isActive = true;
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;
        if (time - lastUpdate > 150) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 100; canvas.height = 100;
                ctx.drawImage(video, 0, 0, 100, 100);
                const imageData = ctx.getImageData(40, 40, 20, 20).data;
                let r = 0, g = 0, b = 0;
                for (let i = 0; i < imageData.length; i += 4) {
                    r += imageData[i]; g += imageData[i+1]; b += imageData[i+2];
                }
                const count = imageData.length / 4;
                sR += (r/count - sR) * 0.3;
                sG += (g/count - sG) * 0.3;
                sB += (b/count - sB) * 0.3;
                processColor(Math.floor(sR), Math.floor(sG), Math.floor(sB)); 
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        const scale = ["C3", "G3", "C4", "D4", "E4", "G4", "A4", "C5", "E5", "G5"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        // Velocity più aggressiva
        const velocity = (hsl.l / 100) * 0.9;

        if (note !== lastNote && velocity > 0.1) {
            synth.releaseAll(); 
            synth.triggerAttackRelease(note, "2n", undefined, velocity);
            lastNote = note;
        }

        filter.frequency.rampTo((hsl.l * 20) + 400, 1);
        document.getElementById('reticolo').style.borderColor = `rgb(${r},${g},${b})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
