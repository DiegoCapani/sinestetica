<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia Ambient Museale</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        /* INTERFACCIA MANTENUTA */
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { display: none; }
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .reticolo {
            width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%; box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #222 0%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #start-btn {
            padding: 20px 60px; font-size: 1.1rem; font-weight: 300; letter-spacing: 3px;
            background: none; color: white; border: 1px solid white; border-radius: 2px;
            cursor: pointer; transition: all 0.5s;
        }
        #start-btn:hover { background: white; color: black; }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">ENTRA NELL'OPERA</button>
        <p style="color: #666; margin-top: 30px; font-size: 0.8rem; letter-spacing: 1px;">SINESTESIA AMBIENT EXPERIENCE</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    const reticolo = document.getElementById('reticolo');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, reverb, phaser, chorus, limiter;
    let isActive = false;
    let lastNote = "";
    let lastUpdate = 0;
    const updateInterval = 150; // Leggermente più lento per massima stabilità CPU

    function setupAudio() {
        // SOLUZIONE SCOPPIETTII: Limiter ferreo a 0dB per evitare clipping
        limiter = new Tone.Limiter(0).toDestination();

        // Gain di compensazione per alzare il volume senza "rompere" l'onda
        const finalGain = new Tone.Gain(3.5).connect(limiter);

        // SUONO NEW AGE: Riverbero lunghissimo
        reverb = new Tone.Reverb({ decay: 8, wet: 0.5 }).connect(finalGain);

        // Effetti di spazialità
        chorus = new Tone.Chorus(1.5, 3.5, 0.7).connect(reverb).start();
        phaser = new Tone.Phaser({ frequency: 0.1, octaves: 2, baseFrequency: 400 }).connect(chorus);

        // Filtro morbido per togliere asprezze
        filter = new Tone.Filter(1200, "lowpass").connect(phaser);
        
        // SINTETIZZATORE PURO
        synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" }, 
            envelope: { 
                attack: 1.2, // Attacco ancora più dolce per eliminare i "clic" iniziali
                decay: 1,
                sustain: 0.8,
                release: 5 // Coda lunghissima per dissolvenze perfette
            }
        }).connect(filter);
        
        // Volume interno basso (per non distorcere prima degli effetti)
        synth.volume.value = -6; 
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 640 } }, 
                audio: false
            });
            video.srcObject = stream;
            return new Promise(resolve => video.onloadedmetadata = () => { video.play(); resolve(); });
        } catch (err) { alert("Attenzione: serve HTTPS per la camera."); }
    }

    startBtn.addEventListener('click', async () => {
        await Tone.start();
        if (Tone.context.state !== 'running') await Tone.context.resume();
        setupAudio();
        await initCamera();
        startScreen.style.display = 'none';
        isActive = true;
        requestAnimationFrame(loop);
    });

    function loop(time) {
        if (!isActive) return;
        if (time - lastUpdate > updateInterval) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Analisi su area piccola per non rubare CPU all'audio
                canvas.width = 64; canvas.height = 64;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const p = ctx.getImageData(32, 32, 1, 1).data;
                processColor(p[0], p[1], p[2]);
                lastUpdate = time;
            }
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        const scale = ["C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        if (note !== lastNote) {
            // SOLUZIONE DISTURBI: Dissolvenza incrociata tra note
            synth.releaseAll(); 
            // triggerAttack con un leggero ritardo temporale (+0.1) per evitare sovrapposizioni elettriche brusche
            synth.triggerAttackRelease(note, "1n", "+0.1", 0.5);
            lastNote = note;
        }

        // Transizione del filtro molto lenta (0.8s) per evitare "bump" audio
        const freq = (hsl.l * 15) + 350;
        filter.frequency.exponentialRampTo(freq, 0.8);

        reticolo.style.borderColor = `rgba(${r},${g},${b}, 0.8)`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
