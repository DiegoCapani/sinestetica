<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia Live - Museo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Video di sfondo */
        video { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1;
        }

        canvas { display: none; }

        /* UI Overlay */
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }

        .reticolo {
            width: 70px; height: 70px; border: 3px solid white;
            border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.6);
            transition: transform 0.1s, border-color 0.2s;
        }

        #info {
            color: white; margin-top: 25px; letter-spacing: 1.5px;
            font-size: 0.9rem; text-shadow: 0 2px 5px #000;
        }

        /* Schermata iniziale per sbloccare Audio e Camera */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        #start-btn {
            padding: 22px 45px; font-size: 1.2rem; font-weight: bold;
            background: #fff; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 10px 30px rgba(255,255,255,0.2);
            transition: transform 0.2s;
        }

        #start-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">ATTIVA LENTE SONORA</button>
        <p style="color: #666; margin-top: 15px;">Assicurati che il volume sia attivo</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
        <p id="info">ANALISI COLORE IN CORSO</p>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    const reticolo = document.getElementById('reticolo');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter;
    let isActive = false;
    let lastNote = "";

    // Inizializzazione Audio
    function setupAudio() {
        // Riverbero per rendere il suono "artistico" e spaziale
        const reverb = new Tone.Reverb({ decay: 4, wet: 0.5 }).toDestination();
        filter = new Tone.Filter(800, "lowpass").connect(reverb);
        
        synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.5, release: 2 }
        }).connect(filter);
        
        synth.volume.value = -10;
    }

    // Inizializzazione Camera
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
            video.srcObject = stream;
            // Attendiamo che il video sia effettivamente pronto per il play
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });
        } catch (err) {
            alert("Errore fotocamera: Usa HTTPS e accetta i permessi.");
            throw err;
        }
    }

    // Click per avviare tutto
    startBtn.addEventListener('click', async () => {
        // IMPORTANTE: Sblocco Audio su Mobile
        await Tone.start();
        if (Tone.context.state !== 'running') {
            await Tone.context.resume();
        }
        
        setupAudio();
        
        try {
            await initCamera();
            startScreen.style.display = 'none';
            isActive = true;
            loop();
        } catch(e) { console.error(e); }
    });

    function loop() {
        if (!isActive) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // Sincronizza dimensioni canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Estrazione colore centrale
            const x = canvas.width / 2;
            const y = canvas.height / 2;
            const p = ctx.getImageData(x, y, 1, 1).data;
            
            processColor(p[0], p[1], p[2]);
        }
        requestAnimationFrame(loop);
    }

    function processColor(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        
        // Scala pentatonica per evitare dissonanze
        const scale = ["C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4", "G4", "A4"];
        const noteIndex = Math.floor((hsl.h / 360) * scale.length);
        const currentNote = scale[noteIndex];

        // Suona solo se la nota è cambiata (per evitare rumore continuo)
        if (currentNote !== lastNote) {
            synth.triggerAttackRelease(currentNote, "2n");
            lastNote = currentNote;
        }

        // Adatta il filtro alla luminosità
        const cutoff = (hsl.l * 20) + 300;
        filter.frequency.rampTo(cutoff, 0.2);

        // Aggiorna interfaccia
        reticolo.style.borderColor = `rgb(${r},${g},${b})`;
        reticolo.style.transform = `scale(${1 + (hsl.s / 150)})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
