<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinestesia Live - Esperienza Museale</title>
    <!-- Caricamento libreria Tone.js per la sintesi sonora -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* Video a tutto schermo come sfondo */
        video { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1;
        }

        /* Canvas nascosto per l'analisi dei pixel */
        canvas { display: none; }

        /* Interfaccia utente */
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }

        .reticolo {
            width: 60px; height: 60px; border: 3px solid white;
            border-radius: 50%; box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        #instruzioni {
            color: white; margin-top: 20px; text-transform: uppercase;
            letter-spacing: 2px; font-size: 0.8rem; text-shadow: 0 2px 4px #000;
        }

        /* Pulsante di avvio obbligatorio per sbloccare l'audio nei browser */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; 
            align-items: center; z-index: 100;
        }

        #start-btn {
            padding: 20px 40px; font-size: 1.1rem; font-weight: bold;
            background: #fff; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">ATTIVA LENTE SONORA</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    
    <div id="ui-overlay">
        <div class="reticolo" id="reticolo"></div>
        <p id="instruzioni">Punta un colore del quadro</p>
    </div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const reticolo = document.getElementById('reticolo');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let synth, filter, lfo;
    let isActive = false;

    // 1. Configurazione della catena sonora
    function setupAudio() {
        // Un filtro che rende il suono più "morbido"
        filter = new Tone.Filter(1000, "lowpass").toDestination();
        
        // Un oscillatore a bassa frequenza per dare movimento al suono
        lfo = new Tone.LFO("4n", 400, 1600).connect(filter.frequency).start();
        
        // Sintetizzatore FM (Frequenza Modulata) per un timbro ricco
        synth = new Tone.MonoSynth({
            oscillator: { type: "sine" },
            envelope: { attack: 0.3, release: 1 }
        }).connect(filter);
        
        synth.volume.value = -12; // Abbassa leggermente il volume
    }

    // 2. Accesso alla fotocamera con gestione errori
    async function initCamera() {
        const constraints = {
            video: { facingMode: "environment" }, // Forza camera posteriore
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            // Forza il play per Safari/iOS
            await video.play();
            console.log("Camera attiva");
        } catch (err) {
            console.error("Errore camera:", err);
            alert("Impossibile accedere alla camera. Usa HTTPS e autorizza il sito.");
        }
    }

    // 3. Gestione del click iniziale
    startBtn.addEventListener('click', async () => {
        // Tone.start() sblocca l'audio sui dispositivi mobili
        await Tone.start();
        setupAudio();
        await initCamera();
        
        startScreen.style.display = 'none';
        isActive = true;
        loop();
    });

    // 4. Ciclo di analisi dei pixel
    function loop() {
        if (!isActive) return;

        // Se il video è pronto, lo analizziamo
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Prendiamo il pixel esattamente al centro
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const pixel = ctx.getImageData(centerX, centerY, 1, 1).data;
            
            updateSound(pixel[0], pixel[1], pixel[2]);
        }

        requestAnimationFrame(loop);
    }

    // 5. Trasformazione Colore -> Suono
    function updateSound(r, g, b) {
        const hsl = rgbToHsl(r, g, b);
        
        // Mappatura Tonalità (0-360) su Scala Pentatonica (armoniosa)
        const scale = ["C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4", "G4", "A4"];
        const index = Math.floor((hsl.h / 360) * scale.length);
        const note = scale[index];

        // Se la nota cambia, innesca il sintetizzatore
        if (synth.frequency.value !== note) {
            synth.triggerAttack(note, "+0.05");
        }

        // La Saturazione (intensità del colore) controlla la velocità del battito (LFO)
        lfo.frequency.rampTo(hsl.s / 10 + 0.5, 0.1);

        // La Luminosità controlla l'apertura del filtro (suono chiaro vs scuro)
        const cutoff = (hsl.l * 30) + 200;
        filter.frequency.rampTo(cutoff, 0.1);

        // Feedback visivo sul reticolo
        reticolo.style.borderColor = `rgb(${r},${g},${b})`;
        reticolo.style.transform = `scale(${1 + (hsl.s / 200)})`;
    }

    // Funzione di utilità per convertire i colori
    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
    }
</script>
</body>
</html>
